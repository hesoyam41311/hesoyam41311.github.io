<!DOCTYPE html><html><head><title>Сложный однострочный сайт</title><style>body{margin:0;overflow:hidden;background:linear-gradient(135deg,#e0f7fa,#80deea,#4fc3f7,#1976d2,#0d47a1);height:100vh;font-family:Arial,sans-serif;cursor:pointer}</style></head><body onmousemove="Array(50).fill(0).forEach((_,i)=>{const e=document.createElement('div');e.style=`position:absolute;width:${Math.random()*20+5}px;height:${Math.random()*20+5}px;background:hsl(${200+Math.random()*60},80%,60%);border-radius:50%;left:${event.clientX+Math.random()*100-50}px;top:${event.clientY+Math.random()*100-50}px;opacity:0.7;transform:scale(${Math.random()*2+0.5})`;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)})" onclick="const p=document.createElement('p');p.textContent='✨ Ты активировал '+(Math.random()>0.5?'квантовый ':'голубой ')+(Math.random()>0.5?'интерфейс':'портал')+'! ✨';p.style=`position:fixed;color:#fff;text-shadow:0 0 10px #01579b;font-size:${Math.random()*3+1}em;left:${Math.random()*80+10}%;top:${Math.random()*80+10}%;transform:rotate(${Math.random()*20-10}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),2000)"><canvas id="c"></canvas><script>const c=document.getElementById('c'),w=c.width=window.innerWidth,h=c.height=window.innerHeight,ctx=c.getContext('2d'),p=Array(100).fill().map(()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*4+1,vx:Math.random()*2-1,vy:Math.random()*2-1}));function a(){ctx.fillStyle='rgba(25,118,210,0.05)';ctx.fillRect(0,0,w,h);p.forEach(i=>{i.x+=i.vx;i.y+=i.vy;if(i.x<0||i.x>w)i.vx*=-1;if(i.y<0||i.y>h)i.vy*=-1;ctx.beginPath();ctx.arc(i.x,i.y,i.r,0,Math.PI*2);ctx.fillStyle=`hsla(${200+i.r*10},80%,60%,0.7)`;ctx.fill();p.slice().reverse().forEach(j=>{const d=Math.sqrt((i.x-j.x)**2+(i.y-j.y)**2);if(d<100){ctx.beginPath();ctx.strokeStyle=`hsla(${200+d},70%,60%,${1-d/100})`;ctx.lineWidth=0.3;ctx.moveTo(i.x,i.y);ctx.lineTo(j.x,j.y);ctx.stroke()}})});requestAnimationFrame(a)}a();setInterval(()=>{document.title=`${Math.random()>0.5?'Голубой ':'Квантовый '}сайт ${Math.random().toString(36).substring(2,8)}`},1000);window.onresize=()=>{c.width=w=window.innerWidth;c.height=h=window.innerHeight}</script></body></html>
