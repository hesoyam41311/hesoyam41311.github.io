<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профессиональная помощь при затоплении</title>
    <style>
        :root {
            --primary: #0066CC;
            --secondary: #003366;
            --accent: #FF6B00;
            --light: #F5F9FF;
            --gray: #F5F5F5;
            --border: #E0E0E0;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            color: #333;
            line-height: 1.6;
            background-color: var(--gray);
        }
        
        .consultation-form {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 420px;
            margin: 2rem auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }
        
        .form-title {
            color: var(--secondary);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #555;
        }
        
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .submit-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        
        .submit-btn:hover {
            background: #E05D00;
            transform: translateY(-2px);
        }
        
        .form-note {
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            margin-top: 1.5rem;
            line-height: 1.4;
        }
        
        .form-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #999;
            font-size: 0.8rem;
        }
        
        .form-divider::before,
        .form-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        
        .form-divider::before {
            margin-right: 1rem;
        }
        
        .form-divider::after {
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="consultation-form">
        <h2 class="form-title">Бесплатная консультация</h2>
        
        <form>
            <div class="form-group">
                <label class="form-label">Ваше имя</label>
                <input type="text" class="form-input" placeholder="Иванов Иван Иванович" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Телефон</label>
                <input type="tel" class="form-input" placeholder="+7 (___) ___-__-__" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Описание ситуации (необязательно)</label>
                <textarea class="form-input form-textarea" placeholder="Когда произошло затопление, какие повреждения..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Получить консультацию</button>
            
            <div class="form-divider">или</div>
            
            <p class="form-note">
                Свяжитесь с нами напрямую:<br>
                Телефон: <a href="tel:+79991234567" style="color: var(--primary); text-decoration: none;">+7 (999) 123-45-67</a><br>
                WhatsApp, Telegram по тому же номеру
            </p>
        </form>
    </div>
</body>
</html>
