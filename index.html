<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юридическая помощь при затоплении квартиры | Взыскание ущерба</title>
    <style>
        :root {
            --primary: #0066CC;
            --secondary: #003366;
            --accent: #FF6B00;
            --light: #F5F9FF;
        }
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            color: #333;
            line-height: 1.6;
        }
        .top-bar {
            background: var(--secondary);
            color: white;
            padding: 10px 0;
            font-size: 14px;
        }
        .contact-links {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .contact-links a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .header {
            background: linear-gradient(rgba(0, 51, 102, 0.7), rgba(0, 51, 102, 0.7)), 
                        url('https://example.com/flooded-house.jpg') center/cover;
            color: white;
            padding: 4rem 0;
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .consultation-form {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(50px);
            opacity: 0;
            animation: slideUp 0.5s forwards 0.3s;
        }
        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .calculator {
            background: var(--light);
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
        }
        .calculator input, .calculator select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="contact-links">
            <a href="tel:+79991234567">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M20 15.5c-1.2 0-2.5-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.5-5.2-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.4-.5-3.6 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>
                +7 (999) 123-45-67
            </a>
            <a href="https://t.me/your_username" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.9 8.2l-1.9 9.1c-.1.6-.4.8-.8.5l-3.7-2.8-1.8 1.7c-.2.2-.4.4-.8.1l.3-3.8 6.8-6.1c.3-.3 0-.4-.4-.1l-8.4 5.3-3.6-1.1c-.6-.2-.6-.6.1-.9l14-5.4c.5-.2 1 .1.8.9z"/></svg>
                Telegram
            </a>
            <a href="https://wa.me/79991234567" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm6.2 17.3c-.3.5-1.6 1.2-2.2 1.2-.6 0-1.3-.2-3.8-1.3-2.9-1.3-4.8-4.4-5-4.6-.1-.3-.4-1.1.1-2.1.2-.5.8-.8 1.3-.6 0 0 .5.2 1.3.7.3.2.5.3.7.1.2-.1.6-.8.8-1.1.1-.2.1-.4 0-.5-.1-.2-.4 0-.8.2-.4.2-.8.4-1 .4-.2 0-.4-.1-.6-.2-.3-.2-.7-.4-1.2-.7-1.9-1-3.2-1.1-3.8-1.1-.7 0-1.7.2-2.5 1.3-.7 1-1 2.3-.7 3.6.3 1.6 1.6 5.4 4.3 7.9 3.1 2.8 6.8 3.6 8.3 3.9 1.5.3 2.8.2 3.4-.2.7-.5.8-1.4.8-1.6 0-.2-.1-.3-.3-.2-.5.2-1.1.3-1.3.3-.3 0-.8-.1-1.1-.4-.7-.5-1.4-1.1-2-1.8-.2-.3-.4-.3-.3-.5.1-.1.5-.5.7-.7.5-.4.8-.9 1-1.4.1-.4.1-.7 0-1-.1-.3-.5-.4-.7-.3-.6.2-1.3.5-1.8.7-.7.3-.8.3-1.1.1-.3-.2-.6-.7-.9-1-.3-.4-.7-.8-1-1.2-.2-.3-.4-.5-.7-.5h-.5c-.2 0-.6.1-.8.6-.3.6-.9 2-.9 2.7 0 .7.3 1 .5 1.3.2.3 1.1 1.7 2.6 2.6 1.5.9 2.6.8 3.1.7.5-.1 1.6-.6 1.8-1.3.2-.7.2-1.3.1-1.4-.1-.1-.3-.2-.6-.1z"/></svg>
                WhatsApp
            </a>
        </div>
    </div>

    <header class="header">
        <h1>Профессиональная помощь при затоплении квартиры</h1>
        <p>Вернем ваши деньги через суд или в досудебном порядке</p>
        
        <div class="consultation-form">
            <h3>Бесплатная консультация</h3>
            <form>
                <input type="text" placeholder="Ваше имя" required>
                <input type="tel" placeholder="Телефон" required>
                <button type="submit" class="btn">Получить консультацию</button>
            </form>
        </div>
    </header>

    <section style="max-width: 1200px; margin: 2rem auto; padding: 0 20px;">
        <div class="calculator">
            <h2>Калькулятор ущерба</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label>Тип помещения</label>
                    <select>
                        <option>Квартира</option>
                        <option>Офис</option>
                        <option>Подвал</option>
                    </select>
                    
                    <label>Площадь затопления (м²)</label>
                    <input type="number" placeholder="20">
                </div>
                <div>
                    <label>Степень повреждения</label>
                    <select>
                        <option>Незначительные</option>
                        <option>Средние</option>
                        <option>Серьезные</option>
                    </select>
                    
                    <label>Поврежденная мебель</label>
                    <input type="number" placeholder="5 предметов">
                </div>
            </div>
            <button class="btn" style="margin-top: 20px;">Рассчитать ущерб</button>
            
            <div id="result" style="margin-top: 20px; padding: 15px; background: #f0f0f0; display: none;">
                <h3>Примерная сумма ущерба: <span id="sum">85 000</span> ₽</h3>
                <p>Для точного расчета оставьте заявку на бесплатный выезд эксперта</p>
            </div>
        </div>
    </section>

    <script>
        // Анимация формы консультации
        document.addEventListener('DOMContentLoaded', function() {
            // Показ результата калькулятора
            document.querySelector('.calculator .btn').addEventListener('click', function() {
                document.getElementById('result').style.display = 'block';
            });
        });
    </script>
</body>
</html>
